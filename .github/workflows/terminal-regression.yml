name: Terminal UI regression checks
on:
  push:
    branches: [feature/nostromo-terminal-ui]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax-and-theme:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all Python sources
        run: python -m compileall -q .
      - name: Install Qt painting dependencies
        run: python -m pip install "PySide6-Essentials>=6.5"
      - name: Run independent theme and offscreen Qt painting tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p "test_terminal*.py" -v
